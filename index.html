<style>
:root{
  --bg:#F4F5F7;
  --ink:#161A20;
  --ink-soft:#636B78;
  --accent:#2E5AAC;
  --accent-dark:#234682;
  --accent-light:#5C82C9;
  --accent-tint:#EAF0FA;
  --success:#1E8E5A;
  --danger:#C23A3A;
  --danger-dark:#9C2E2E;
  --amber:#B8792A;
  --cream:#FFFFFF;
  --line:#E1E4E9;
  --line-soft:#EBEDF0;
  --radius:10px;
  --radius-sm:7px;
  --shadow-card: 0 1px 2px rgba(22,26,32,0.04), 0 6px 16px rgba(22,26,32,0.05);
  --shadow-pop: 0 10px 28px rgba(22,26,32,0.18);
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans); overscroll-behavior:none;}
body{
  min-height:100vh;
  padding-bottom:84px;
}
button{font-family:var(--sans); cursor:pointer;}
button:active{ transform:scale(.97); }
h1,h2,h3{margin:0; font-family:var(--sans);}
.eyebrow{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:7px;
}
.eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }
.settings-group-label{
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); margin:26px 0 10px; display:flex; align-items:center; gap:8px;
}
.settings-group-label:first-child{ margin-top:0; }
.settings-group-label::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
.settings-subtitle{
  font-size:12.5px; font-weight:700; color:var(--ink); margin:4px 0 8px;
  padding-top:14px; border-top:1px solid var(--line-soft);
}
.settings-subtitle:first-child{ padding-top:0; border-top:none; }
.exo-group-label{
  font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin:18px 0 2px; padding-top:14px; border-top:1px solid var(--line-soft);
}
.exo-group-label:first-of-type{ margin-top:4px; padding-top:0; border-top:none; }
.hidden{display:none !important;}

/* ===== Top bar ===== */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--ink); color:#fff;
  padding:18px 20px 16px;
  box-shadow:0 1px 0 rgba(0,0,0,0.08);
}
.topbar-content{position:relative; z-index:1;}
.topbar .brand{
  font-weight:800; letter-spacing:.01em;
  font-size:19px; display:flex; align-items:baseline; gap:8px;
}
.topbar .brand small{
  font-size:11px; font-weight:500; letter-spacing:.04em; color:#9AA6B8;
}
.topbar .sub{font-size:12px; color:#8A94A3; margin-top:3px; font-family:var(--mono);}

/* ===== Views ===== */
.view{padding:18px 16px; max-width:640px; margin:0 auto;}
.view{ animation: fadein .2s var(--ease); }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

.card{
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  position:relative;
  box-shadow:var(--shadow-card);
  animation: cardIn .25s var(--ease) backwards;
}
.card:nth-of-type(1){animation-delay:0s;}
.card:nth-of-type(2){animation-delay:.03s;}
.card:nth-of-type(3){animation-delay:.06s;}
.card:nth-of-type(4){animation-delay:.09s;}
.card:nth-of-type(5){animation-delay:.12s;}
@keyframes cardIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){
  .card, .view, .check-btn.pop, .rpe-dot.on, .navbar button.active .ic, .card.today::after{ animation:none !important; }
}
.card.done{ border-left:3px solid var(--success); }
.card.today{ border-left:3px solid var(--accent); }
.card.today::after{
  content:""; position:absolute; top:16px; right:16px; width:7px; height:7px; border-radius:50%;
  background:var(--accent);
}

.section-title{
  font-weight:700; letter-spacing:0; font-size:15.5px;
  margin-bottom:3px; line-height:1.3;
}
.section-meta{font-size:12px; color:var(--ink-soft); font-family:var(--mono);}

/* ===== Exercise rows ===== */
.exo{
  border-top:1px solid var(--line-soft);
  padding:13px 0;
}
.exo:first-of-type{border-top:none; padding-top:8px;}
.exo-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
.exo-name{font-weight:600; font-size:14.5px; line-height:1.35;}
.exo-set{font-family:var(--mono); font-size:12.5px; color:var(--accent-dark); font-weight:700; white-space:nowrap; background:var(--accent-tint); padding:2px 8px; border-radius:6px;}
.exo-desc{font-size:12.5px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
.exo-rest{font-size:11px; color:#8B93A0; font-family:var(--mono); margin-top:5px;}
.video-link{
  display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:11.5px; font-weight:600;
  color:var(--accent-dark); text-decoration:none; padding:5px 10px; border:1px solid var(--line);
  border-radius:7px; transition:all .15s var(--ease); background:var(--accent-tint);
}
.video-link:active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.reorder-controls{ display:flex; gap:6px; margin-top:10px; }
.reorder-btn{ min-height:36px; padding:6px 16px; font-size:14px; line-height:1; }
.reorder-btn:disabled{ opacity:.3; }

.exo-log{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:flex-end;}
.sup-time-wrap{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:flex-end;}
.exo-log input{
  width:68px; padding:9px 8px; border:1px solid var(--line); border-radius:var(--radius-sm);
  font-family:var(--mono); font-size:13px; background:#fff; transition:border-color .15s;
}
.exo-log input:focus{ outline:none; border-color:var(--accent); }
.exo-log label{font-size:10px; color:var(--ink-soft); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
.exo-log .field{display:flex; flex-direction:column;}
.check-btn{
  width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
  font-size:16px; color:var(--line); flex-shrink:0; margin-left:auto; align-self:flex-end;
  transition:all .15s var(--ease); display:flex; align-items:center; justify-content:center;
}
.check-btn.on{ background:var(--success); border-color:var(--success); color:#fff; box-shadow:0 2px 8px rgba(30,142,90,0.3); }
.check-btn.pop{ animation: popScale .38s var(--ease); }
@keyframes popScale{ 0%{transform:scale(1);} 45%{transform:scale(1.25);} 100%{transform:scale(1);} }

/* ===== RPE dial ===== */
.rpe-row{display:flex; gap:4px; margin-top:8px;}
.rpe-dot{
  flex:1; height:24px; min-width:0; border:1px solid var(--line); background:#fff; border-radius:5px;
  font-size:9px; font-family:var(--mono); font-weight:700; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; transition:all .15s var(--ease); padding:0;
}
.rpe-dot.on{background:var(--accent); border-color:var(--accent); color:#fff; transform:scale(1.05); animation: popScale .32s var(--ease);}
.rpe-label{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:8px; font-weight:600;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:13px 18px; border-radius:var(--radius-sm); border:1px solid var(--ink);
  background:var(--ink); color:#fff; font-weight:600; font-size:13px;
  letter-spacing:.01em; transition:transform .12s var(--ease), opacity .12s;
  min-height:44px;
}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn.ghost.on-dark{ color:var(--ink); border-color:var(--line); background:#fff; }
.btn.accent{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 3px 10px rgba(46,90,172,0.25);}
.btn.small{padding:9px 12px; font-size:11.5px; min-height:36px;}
.btn.block{width:100%;}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--line);}
.btn.danger.on-dark{ color:var(--danger); border-color:var(--line); background:#fff; }
.btn.danger.armed{ background:var(--danger); color:#fff; border-color:var(--danger); animation: armedPulse 1s ease-in-out infinite; }
@keyframes armedPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.75; } }

/* ===== Bottom nav ===== */
.navbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--ink); border-top:1px solid rgba(255,255,255,0.06);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(0,0,0,0.15);
}
.navbar button{
  flex:1; background:none; border:none; color:#7C8798; padding:11px 2px 9px;
  font-size:9.5px; letter-spacing:.02em; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:4px; transition:color .15s;
}
.navbar button .ic{width:21px; height:21px; display:block; transition:transform .2s var(--ease);}
.navbar button .ic svg{width:100%; height:100%; display:block;}
.navbar button.active{color:#fff;}
.navbar button.active .ic{color:var(--accent-light);}

/* ===== Week grid ===== */
.week-day{
  display:flex; justify-content:space-between; align-items:center;
  padding:13px 0; border-top:1px solid var(--line-soft);
  gap:8px;
}
.week-day:first-child{border-top:none;}
.week-day .dname{font-weight:700; font-size:12.5px; width:72px; flex-shrink:0;}
.week-day select{
  flex:1; min-width:0; padding:9px 8px; border:1px solid var(--line); background:#fff;
  font-family:var(--sans); font-size:12.5px; border-radius:var(--radius-sm);
}
.week-day .dur{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); width:58px; text-align:right; flex-shrink:0;}

/* ===== Program list ===== */
.prog-pill{
  display:inline-block; padding:9px 13px; margin:0 6px 8px 0; border:1px solid var(--line);
  border-radius:8px; font-size:12px; font-weight:600;
  letter-spacing:.01em; background:#fff; transition:all .15s var(--ease); color:var(--ink-soft);
}
.prog-pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.sub-prog-pill{ border-style:dashed; }
.sub-prog-pill.active{ border-style:solid; }

textarea, input[type=text], input[type=number], input[type=date], input[type=time]{
  font-family:var(--sans); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:10px; font-size:13.5px; width:100%; background:#fff; transition:border-color .15s;
}
textarea:focus, input:focus{ outline:none; border-color:var(--accent); }
textarea{min-height:64px; resize:vertical;}
.field-row{margin-bottom:12px;}
.field-row label{font-size:11px; letter-spacing:.03em; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:600;}

.edit-toggle{
  position:absolute; top:16px; right:16px; font-size:11px; color:var(--ink-soft);
  border:1px solid var(--line); background:#fff; padding:7px 11px; border-radius:7px; font-weight:600;
  letter-spacing:.02em; min-height:auto;
}

.divider-note{
  border-left:3px solid var(--accent); padding:10px 13px; font-size:12.5px; color:var(--ink-soft);
  background:var(--accent-tint); margin:12px 0; line-height:1.5; border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.empty{text-align:center; padding:50px 16px; color:var(--ink-soft); font-size:13.5px; line-height:1.6;}
.empty .empty-ic{ opacity:.4; margin-bottom:14px; display:flex; justify-content:center; color:var(--ink-soft); }

.streak-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.streak-chip{
  font-family:var(--mono); font-size:11px; padding:6px 11px; border-radius:7px;
  background:var(--ink); color:#fff; font-weight:600;
}

/* ===== Progress ring (Aujourd'hui) ===== */
.progress-wrap{display:flex; align-items:center; gap:14px; margin-top:4px;}
.progress-ring{flex-shrink:0;}
.progress-text{font-family:var(--mono); font-size:12px; color:var(--ink-soft); line-height:1.5;}
.progress-text b{color:var(--ink); font-size:15px; display:block; font-family:var(--sans); font-weight:700;}
.progress-text .kcal-tag{display:block; color:var(--accent-dark); font-weight:600; margin-top:2px;}

/* ===== Suivi musculaire / silhouette ===== */
.body-map-wrap{ text-align:center; margin:8px 0 4px; }
.body-svg .muscle-zone{ stroke:#B9C0CC; stroke-width:1.2; transition:fill .5s var(--ease); }
.body-svg .zone-neglected{ animation: neglectPulse 1.6s ease-in-out infinite; }
@keyframes neglectPulse{ 0%,100%{ stroke:#B9C0CC; stroke-width:1.2; } 50%{ stroke:var(--danger); stroke-width:2.6; } }
.muscle-list{ margin-top:10px; }
.muscle-row{ display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line-soft); }
.muscle-row:first-child{ border-top:none; }
.muscle-name{ flex:1; font-weight:600; font-size:13px; }
.muscle-row.neglected .muscle-name{ color:var(--danger-dark); }
.rank-pill{ font-size:10px; font-weight:700; letter-spacing:.02em; color:#fff; padding:4px 10px; border-radius:6px; white-space:nowrap; }
.muscle-last{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); width:64px; text-align:right; flex-shrink:0; }
.neglect-flag{ color:var(--danger); font-size:14px; width:16px; text-align:center; flex-shrink:0; }
.neglect-flag-spacer{ width:16px; flex-shrink:0; }

/* ===== Toast de notification ===== */
.app-toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px;
  font-size:13px; font-weight:600; box-shadow:var(--shadow-pop); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .25s var(--ease), transform .25s var(--ease);
  max-width:85vw; text-align:center; border:1px solid rgba(255,255,255,0.1);
}
.app-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.app-toast.error{ background:var(--danger); border-color:var(--danger); }

/* ===== Niveau du personnage / XP ===== */
.level-card{ display:flex; align-items:center; gap:14px; }
.level-badge{
  width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800;
  flex-shrink:0; box-shadow:0 3px 10px rgba(46,90,172,0.3);
}
.level-info{ flex:1; min-width:0; }
.level-title{ font-weight:700; font-size:14px; margin-bottom:6px; }
.level-subtitle{ color:var(--ink-soft); font-weight:500; }
.level-bar{ height:8px; background:var(--line-soft); border-radius:5px; overflow:hidden; }
.level-bar-fill{ height:100%; background:var(--accent); border-radius:5px; transition:width .4s var(--ease); }
.level-xp{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:5px; }

/* ===== Barres de progression par groupe musculaire ===== */
.muscle-row{ padding:11px 0; }
.muscle-row-top{ display:flex; align-items:center; gap:8px; }
.rank-bar{ height:6px; background:var(--line-soft); border-radius:4px; overflow:hidden; margin-top:7px; }
.rank-bar-fill{ height:100%; border-radius:4px; transition:width .4s var(--ease); }
.rank-xp-text{ font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-top:4px; }

/* ===== Célébration de montée de rang / niveau ===== */
.rankup-overlay{
  position:fixed; inset:0; background:rgba(10,12,16,0.72); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:24px;
  opacity:0; animation: rankupFade .25s ease forwards;
}
.rankup-overlay.closing{ animation: rankupFadeOut .25s ease forwards; }
@keyframes rankupFade{ to{opacity:1;} }
@keyframes rankupFadeOut{ from{opacity:1;} to{opacity:0;} }
.rankup-card{
  background:#fff; border-radius:18px; padding:32px 26px; max-width:300px; width:100%;
  text-align:center; position:relative; overflow:visible;
  transform:scale(.7); animation: rankupPop .5s cubic-bezier(.2,1.4,.4,1) forwards;
  box-shadow:0 24px 60px rgba(0,0,0,0.4);
}
@keyframes rankupPop{ to{transform:scale(1);} }
.rankup-badge{
  width:66px; height:66px; border-radius:50%; margin:0 auto 16px; display:flex;
  align-items:center; justify-content:center; font-size:28px; color:#fff; font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,0.25); position:relative; z-index:2;
}
.rankup-title{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; margin-bottom:5px; position:relative; z-index:2; }
.rankup-name{ font-size:18px; font-weight:800; margin-bottom:12px; position:relative; z-index:2; }
.rankup-list{ font-size:13px; color:var(--ink-soft); line-height:1.7; position:relative; z-index:2; }
.rankup-hint{ font-size:10.5px; color:var(--ink-soft); opacity:.6; margin-top:16px; text-transform:uppercase; letter-spacing:.05em; position:relative; z-index:2; }
.confetti-piece{
  position:absolute; top:50%; left:50%; width:7px; height:7px; border-radius:2px;
  opacity:0; z-index:1; animation: confettiBurst 1.1s ease-out forwards;
}
@keyframes confettiBurst{
  0%{ transform:translate(-50%,-50%) scale(.5); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(180deg); opacity:0; }
}

/* ===== Chat IA locale ===== */
.chat-box{
  max-height:320px; overflow-y:auto; display:flex; flex-direction:column;
  padding:4px 2px; margin-top:4px;
}
.chat-msg{
  padding:9px 13px; border-radius:14px; margin-bottom:8px; font-size:13px; line-height:1.5;
  max-width:85%; white-space:pre-wrap; word-break:break-word;
}
.chat-msg.user{ background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:3px; }
.chat-msg.assistant{ background:var(--line-soft); color:var(--ink); margin-right:auto; border-bottom-left-radius:3px; }

/* ===== Bandeau héro Nutrition ===== */
.nutrition-hero{
  background:linear-gradient(135deg, #DFF3E6, #CDEBDB);
  border-radius:var(--radius); padding:20px 14px 16px; margin-bottom:14px;
  border:1px solid #C3E4D2;
}
.hero-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.hero-pill{
  background:rgba(255,255,255,0.65); border-radius:14px; padding:10px 12px; text-align:center;
  min-width:74px; flex-shrink:0;
}
.hero-pill-icon{ font-size:16px; line-height:1; }
.hero-pill-value{ font-weight:800; font-size:15px; color:#1a3324; margin-top:3px; }
.hero-pill-label{ font-size:9.5px; color:#4b6b57; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; font-weight:600; }
.hero-ring-wrap{ position:relative; width:120px; height:120px; flex-shrink:0; }
.hero-ring-value{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.hero-ring-kcal{ font-size:24px; font-weight:800; color:#1a3324; line-height:1.1; }
.hero-ring-label{ font-size:9.5px; color:#4b6b57; text-transform:uppercase; letter-spacing:.03em; text-align:center; max-width:80px; margin-top:2px; font-weight:600; }
.hero-macros-row{ display:flex; gap:10px; margin-top:18px; }
.hero-macro{ flex:1; text-align:center; }
.hero-macro-bar{ height:5px; background:rgba(255,255,255,0.6); border-radius:4px; overflow:hidden; margin-bottom:5px; }
.hero-macro-bar-fill{ height:100%; border-radius:4px; transition:width .4s var(--ease); }
.hero-macro-label{ font-size:9.5px; color:#4b6b57; text-transform:uppercase; letter-spacing:.02em; font-weight:600; }
.hero-auto-tag{ text-align:center; font-size:10.5px; color:#4b6b57; margin-top:12px; font-weight:600; }

/* ===== Cartes de repas (façon Foodvisor) ===== */
.meal-card-v2 .meal-card-header{ display:flex; align-items:center; gap:11px; }
.meal-emoji{
  width:42px; height:42px; border-radius:50%; background:var(--accent-tint);
  display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
}
.meal-card-name{ font-weight:700; font-size:14.5px; }
.meal-card-kcal{ font-size:12px; color:var(--ink-soft); font-family:var(--mono); margin-top:1px; }
.meal-add-btn{
  width:36px; height:36px; border-radius:50%; background:var(--ink); color:#fff; border:none;
  font-size:19px; line-height:1; flex-shrink:0; margin-left:auto; display:flex; align-items:center; justify-content:center;
}
.meal-card-preview{ font-size:12.5px; color:var(--ink-soft); margin-top:10px; line-height:1.45; }

::-webkit-scrollbar{display:none;}
</style>

// ---------- State ----------
function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(!parsed.profile.poids_kg){
        const m = (parsed.profile.taille_poids||"").match(/(\d{2,3})\s*(?:-\s*(\d{2,3}))?\s*kg/i);
        parsed.profile.poids_kg = m ? Math.round((parseFloat(m[1]) + parseFloat(m[2]||m[1]))/2) : 75;
      }
      if(!parsed.profile.height_cm){
        const mh = (parsed.profile.taille_poids||"").match(/(\d[\d,.]*)\s*m\b/i);
        parsed.profile.height_cm = mh ? Math.round(parseFloat(mh[1].replace(",", ".")) * 100) : 177;
      }
      if(!parsed.profile.age_years){
        const ma = (parsed.profile.age||"").match(/(\d{2})/);
        parsed.profile.age_years = ma ? parseInt(ma[1]) : 20;
      }
      if(!parsed.profile.sex) parsed.profile.sex = "M";
      if(!parsed.profile.activityLevel) parsed.profile.activityLevel = "active";
      if(!parsed.profile.goal) parsed.profile.goal = "recomp";
      if(!parsed.supplements) parsed.supplements = JSON.parse(JSON.stringify(SEED_DATA.supplements));
      if(!parsed.weightLog) parsed.weightLog = {};
      if(!parsed.nutritionLog) parsed.nutritionLog = {};
      if(!parsed.customFoods) parsed.customFoods = [];
      if(!parsed.nutritionGoals) parsed.nutritionGoals = JSON.parse(JSON.stringify(DEFAULT_NUTRITION_GOALS));
      if(typeof parsed.nutritionGoals.auto === "undefined") parsed.nutritionGoals.auto = false;
      migrateProgramsData(parsed);
      return parsed;
    }catch(e){ console.warn("Corrupted state, reseeding", e); }
  }
  return {
    profile: JSON.parse(JSON.stringify(SEED_DATA.profile)),
    methode: JSON.parse(JSON.stringify(SEED_DATA.methode)),
    weeklyPlan: JSON.parse(JSON.stringify(SEED_DATA.weeklyPlan)),

    equipment: JSON.parse(JSON.stringify(SEED_DATA.equipment)),

    supplements: JSON.parse(JSON.stringify(SEED_DATA.supplements)),
    weightLog: {}, // { "YYYY-MM-DD": poidsKg }
    nutritionLog: {}, // { "YYYY-MM-DD": { water_ml, meals:[{id,name,kcal,protein,carbs,fat,time,source}] } }
    customFoods: [], // aliments créés manuellement par l'utilisateur, réutilisables
    nutritionGoals: JSON.parse(JSON.stringify(DEFAULT_NUTRITION_GOALS)),
    logs: {} // { "YYYY-MM-DD": { programKey, note, locked, extraPrograms:[], substitutions:{}, supplements:{}, exercises:{id:{poids,reps,rpe,done}} } }
  };
}

// Complète les carnets déjà sauvegardés (avant l'ajout des tags muscles/MET/substitutions)
// avec les nouveaux champs, sans écraser les modifications personnelles déjà faites par l'utilisateur.
function migrateProgramsData(parsed){
  if(!parsed.programs) return;
  Object.keys(SEED_DATA.programs).forEach(key=>{
    const seedProg = SEED_DATA.programs[key];
    if(!parsed.programs[key]){
      // programme introduit dans une mise à jour ultérieure : on l'ajoute tel quel
      parsed.programs[key] = JSON.parse(JSON.stringify(seedProg));
      return;
    }
    const userProg = parsed.programs[key];
    if(typeof userProg.met === "undefined") userProg.met = seedProg.met;
    const seedExById = {};
    seedProg.exercises.forEach(ex=> seedExById[ex.id] = ex);
    userProg.exercises.forEach(ex=>{
      const seedEx = seedExById[ex.id];
      if(!seedEx) return; // exercice personnalisé ajouté par l'utilisateur : pas de tag muscle connu
      if(typeof ex.m === "undefined") ex.m = seedEx.m;
      if(typeof ex.sub === "undefined" && seedEx.sub) ex.sub = seedEx.sub;
      if(typeof ex.category === "undefined" && seedEx.category) ex.category = seedEx.category;
    });
  });

  // Rattrapage ciblé : les carnets ayant déjà "Points faibles" (avant l'ajout du bloc poignets/tibias)
  // reçoivent les exercices manquants + le nom/durée à jour, sans perdre les données déjà notées.
  const pf = parsed.programs.points_faibles;
  const seedPf = SEED_DATA.programs.points_faibles;
  if(pf && seedPf && !pf.exercises.some(ex=>ex.id==="rf_pj1")){
    pf.name = seedPf.name;
    pf.subtitle = seedPf.subtitle;
    pf.duration = seedPf.duration;
    pf.note = seedPf.note;
    const missing = seedPf.exercises.filter(ex=> ex.id.startsWith("rf_pj"));
    pf.exercises.push(...JSON.parse(JSON.stringify(missing)));
  }
}

const DEFAULT_NUTRITION_GOALS = { kcal:2800, protein:170, carbs:300, fat:80, water_ml:3000, auto:false };

const ACTIVITY_LEVELS = [
  { key:"sedentary", label:"Sédentaire (peu ou pas de sport)", factor:1.2 },
  { key:"light",     label:"Léger (1-2 séances/semaine)",       factor:1.375 },
  { key:"moderate",  label:"Modéré (3-4 séances/semaine)",      factor:1.55 },
  { key:"active",    label:"Actif (5-6 séances/semaine, combat)", factor:1.725 },
  { key:"veryactive",label:"Très actif (2 séances/jour, compétition)", factor:1.9 }
];
const GOAL_TYPES = [
  { key:"lose",   label:"Perte de poids",         kcalAdjust:-400, proteinPerKg:2.2 },
  { key:"maintain", label:"Maintien",             kcalAdjust:0,    proteinPerKg:1.8 },
  { key:"recomp", label:"Recomposition (perdre du gras + prendre du muscle)", kcalAdjust:-150, proteinPerKg:2.2 },
  { key:"gain",   label:"Prise de masse",         kcalAdjust:300,  proteinPerKg:1.8 }
];

// Calcule les besoins caloriques/macros/eau automatiquement à partir du profil (formule de Mifflin-St Jeor)
function computeAutoNutritionGoals(profile){
  const weight = parseFloat(profile.poids_kg) || 75;
  const height = parseFloat(profile.height_cm) || 175;
  const age = parseFloat(profile.age_years) || 25;
  const sex = profile.sex === "F" ? "F" : "M";
  const activity = ACTIVITY_LEVELS.find(a=>a.key===profile.activityLevel) || ACTIVITY_LEVELS[3];
  const goal = GOAL_TYPES.find(g=>g.key===profile.goal) || GOAL_TYPES[2];

  const bmr = sex === "F"
    ? (10*weight + 6.25*height - 5*age - 161)
    : (10*weight + 6.25*height - 5*age + 5);
  const tdee = bmr * activity.factor;
  const kcal = Math.round(tdee + goal.kcalAdjust);

  const protein = Math.round(weight * goal.proteinPerKg);
  const fat = Math.round((kcal * 0.25) / 9);
  const carbsKcal = Math.max(0, kcal - (protein*4) - (fat*9));
  const carbs = Math.round(carbsKcal / 4);
  const water_ml = Math.round(weight * 35 + 500); // +500 ml pour compenser la transpiration en sport de combat

  return { kcal, protein, carbs, fat, water_ml, bmr:Math.round(bmr), tdee:Math.round(tdee) };
}

// Renvoie les objectifs à utiliser réellement : calculés à la volée si le mode auto est actif, sinon les valeurs manuelles enregistrées
function getEffectiveNutritionGoals(){
  const goals = state.nutritionGoals || DEFAULT_NUTRITION_GOALS;
  if(goals.auto){
    const auto = computeAutoNutritionGoals(state.profile);
    return { kcal:auto.kcal, protein:auto.protein, carbs:auto.carbs, fat:auto.fat, water_ml:auto.water_ml, auto:true };
  }
  return goals;
}

function getNutritionDay(dateISO){
  if(!state.nutritionLog[dateISO]) state.nutritionLog[dateISO] = { water_ml:0, meals:[] };
  const day = state.nutritionLog[dateISO];
  if(typeof day.water_ml !== "number") day.water_ml = 0;
  if(!Array.isArray(day.meals)) day.meals = [];
  return day;
}
function sumMacros(meals){
  return meals.reduce((acc,m)=>{
    acc.kcal += m.kcal||0; acc.protein += m.protein||0; acc.carbs += m.carbs||0; acc.fat += m.fat||0;
    return acc;
  }, { kcal:0, protein:0, carbs:0, fat:0 });
}


// Renvoie la liste à plat de tous les exercices réellement proposés pour une séance donnée :
// programme principal (avec substitutions appliquées) + programmes complémentaires ajoutés.
// Chaque entrée : { ex, met }
function getSessionExercises(log){
  const list = [];
  const mainProg = state.programs[log.programKey];
  if(mainProg){
    mainProg.exercises.forEach(ex=>{
      if(ex.sub && log.substitutions && log.substitutions[ex.id]){
        const subProg = state.programs[ex.sub];
        if(subProg) subProg.exercises.forEach(subEx=> list.push({ ex:subEx, met:subProg.met||5 }));
      } else {
        list.push({ ex, met:mainProg.met||5 });
      }
    });
  }
  (log.extraPrograms||[]).forEach(key=>{
    const p = state.programs[key];
    if(p) p.exercises.forEach(ex=> list.push({ ex, met:p.met||5 }));
  });
  return list;
}

// Analyse le texte "sets" d'un exercice pour déterminer s'il se pratique en
// répétitions (ex: "4 x 12-15") ou sur une durée fixe (ex: "3 min effort", "3 x 20-30 s").
// C'est cette classification qui décide si on utilise les répétitions notées
// par l'utilisateur, ou la durée prévue par le programme.
function classifyExercise(setsStr){
  if(!setsStr) return { type:"reps", sets:1, perSetReps:10 };
  const s = setsStr.toLowerCase();
  let m = s.match(/^(\d+)\s*x\s*([\d.]+)(?:-([\d.]+))?\s*s\b/);
  if(m) return { type:"duration", sets:parseInt(m[1]), perSetSeconds:(parseFloat(m[2])+parseFloat(m[3]||m[2]))/2 };
  m = s.match(/^(\d+)\s*x\s*([\d.]+)(?:-([\d.]+))?\s*min\b/);
  if(m) return { type:"duration", sets:parseInt(m[1]), perSetSeconds:((parseFloat(m[2])+parseFloat(m[3]||m[2]))/2)*60 };
  m = s.match(/^(\d+)\s*x\s*([\d.]+)(?:-([\d.]+))?/);
  if(m) return { type:"reps", sets:parseInt(m[1]), perSetReps:(parseFloat(m[2])+parseFloat(m[3]||m[2]))/2 };
  m = s.match(/^(\d+)\s*x\s*max/);
  if(m) return { type:"reps", sets:parseInt(m[1]), perSetReps:null };
  m = s.match(/^([\d.]+)(?:-([\d.]+))?\s*min\b/);
  if(m) return { type:"duration", sets:1, perSetSeconds:((parseFloat(m[1])+parseFloat(m[2]||m[1]))/2)*60 };
  m = s.match(/^([\d.]+)(?:-([\d.]+))?\s*s\b/);
  if(m) return { type:"duration", sets:1, perSetSeconds:(parseFloat(m[1])+parseFloat(m[2]||m[1]))/2 };
  m = s.match(/^(\d+)/);
  if(m) return { type:"reps", sets:1, perSetReps:parseFloat(m[1]) };
  return { type:"reps", sets:1, perSetReps:10 };
}
function parseRestSeconds(restStr){
  if(!restStr || restStr==="—") return 0;
  const s = restStr.toLowerCase();
  if(s.includes("min")){ const m = s.match(/([\d.]+)/); return m ? parseFloat(m[1])*60 : 0; }
  const m = s.match(/([\d.]+)/);
  return m ? parseFloat(m[1]) : 0;
}
const SECONDS_PER_REP = 2.6; // hypothèse moyenne (phase concentrique + excentrique)

// Estime les calories d'un exercice. Si l'exercice est chronométré (round, gainage, etc.),
// on utilise la durée prévue par le programme (fiable). S'il se compte en répétitions,
// on utilise en priorité les répétitions RÉELLEMENT notées par l'utilisateur (fiable) ;
// à défaut, une moyenne du programme (moins fiable, purement indicative).
// Retourne { kcal, reliability: 'bonne'|'estimee' }
function estimateExerciseKcal(ex, met, weightKg, loggedReps){
  const info = classifyExercise(ex.sets);
  const restSeconds = parseRestSeconds(ex.rest);
  let totalSeconds, reliability;

  if(info.type === "duration"){
    totalSeconds = info.sets*info.perSetSeconds + Math.max(0, info.sets-1)*restSeconds;
    reliability = "bonne"; // durée fixée par le programme, peu d'incertitude
  } else {
    const loggedNum = parseFloat(loggedReps);
    let repsPerSet;
    if(loggedNum && loggedNum > 0){
      repsPerSet = loggedNum;
      reliability = "bonne"; // basé sur ce que tu as réellement noté
    } else {
      repsPerSet = info.perSetReps || 8;
      reliability = "estimee"; // valeur moyenne par défaut, aucune répétition notée
    }
    totalSeconds = info.sets*repsPerSet*SECONDS_PER_REP + Math.max(0, info.sets-1)*restSeconds;
  }

  const hours = totalSeconds/3600;
  return { kcal: met*weightKg*hours, reliability };
}

// Calories d'une séance : seulement les exercices cochés "fait" (reflète l'effort réellement fourni).
// reliability globale = "bonne" seulement si AUCUN exercice n'a dû être estimé par défaut.
function estimateSessionKcalDone(log, weightKg){
  let total = 0, anyEstimated = false, anyCounted = false;
  getSessionExercises(log).forEach(({ex, met})=>{
    const exLog = log.exercises ? log.exercises[ex.id] : null;
    if(exLog && exLog.done){
      anyCounted = true;
      const r = estimateExerciseKcal(ex, met, weightKg, exLog.reps);
      total += r.kcal;
      if(r.reliability === "estimee") anyEstimated = true;
    }
  });
  return { kcal: Math.round(total), reliability: anyCounted ? (anyEstimated ? "estimee" : "bonne") : "bonne" };
}



// ---------- Rangs musculaires ----------
function daysBetweenISO(iso, refDate){
  const [y,mo,d] = iso.split("-").map(Number);
  const dt = new Date(y, mo-1, d);
  return Math.floor((refDate - dt) / (1000*60*60*24));
}
function computeMuscleStats(){
  const windowDays = 28;
  const neglectDays = 10;
  const xpPerTrainingDay = 15;
  const today = new Date();
  const stats = {};
  MUSCLE_GROUPS.forEach(m => stats[m] = { count:0, totalXP:0, lastISO:null, lastDaysAgo:null, neglected:false });

  Object.keys(state.logs).forEach(dateISO=>{
    const log = state.logs[dateISO];
    if(!log.programKey && (!log.extraPrograms || !log.extraPrograms.length)) return;
    const daysAgo = daysBetweenISO(dateISO, today);
    const hitToday = new Set();
    getSessionExercises(log).forEach(({ex})=>{
      const exLog = log.exercises[ex.id];
      if(exLog && exLog.done && ex.m) ex.m.forEach(m=> hitToday.add(m));
    });
    hitToday.forEach(m=>{
      if(!stats[m]) return;
      if(daysAgo <= windowDays) stats[m].count++;
      stats[m].totalXP += xpPerTrainingDay; // XP cumulé à vie, ne se réinitialise jamais
      if(stats[m].lastISO===null || dateISO > stats[m].lastISO) stats[m].lastISO = dateISO;
    });
  });

  MUSCLE_GROUPS.forEach(m=>{
    const st = stats[m];
    if(st.lastISO){
      st.lastDaysAgo = daysBetweenISO(st.lastISO, today);
      st.neglected = st.lastDaysAgo > neglectDays;
    } else {
      st.lastDaysAgo = null;
      st.neglected = true; // jamais travaillé = à surveiller aussi
    }
  });
  return stats;
}

function getRankForXP(xp){

  const tier = RANK_TIERS[idx];
  const next = RANK_TIERS[idx+1] || null;
  const progressPct = next ? Math.min(100, Math.round(((xp - tier.xp) / (next.xp - tier.xp)) * 100)) : 100;
  return { ...tier, tierIndex:idx, xp, next, progressPct };
}

// ---------- Niveau global du "personnage" (cumul de l'XP de tous les groupes musculaires) ----------
const LEVEL_TITLES = [
  { level:1,  title:"Débutant" },
  { level:4,  title:"Combattant" },
  { level:8,  title:"Guerrier" },
  { level:13, title:"Vétéran" },
  { level:20, title:"Champion absolu" }
];
const XP_PER_LEVEL = 150;
function getLevelForXP(totalXP){
  const level = Math.floor(totalXP / XP_PER_LEVEL) + 1;
  const xpIntoLevel = totalXP % XP_PER_LEVEL;
  const progressPct = Math.round((xpIntoLevel / XP_PER_LEVEL) * 100);
  let title = LEVEL_TITLES[0].title;
  LEVEL_TITLES.forEach(t=>{ if(level >= t.level) title = t.title; });
  return { level, title, xpIntoLevel, xpForNextLevel:XP_PER_LEVEL, progressPct, totalXP };
}
function getTotalXP(stats){
  return MUSCLE_GROUPS.reduce((sum,m)=> sum + (stats[m] ? stats[m].totalXP : 0), 0);
}

// Détecte les montées de rang / de niveau depuis le dernier calcul, et met à jour l'état sauvegardé.
function checkRankUps(){
  const stats = computeMuscleStats();
  if(!state.muscleRankState) state.muscleRankState = {};
  const promotions = [];
  MUSCLE_GROUPS.forEach(m=>{
    const rank = getRankForXP(stats[m].totalXP);
    const prevKey = state.muscleRankState[m];
    if(prevKey !== undefined){
      const prevIdx = RANK_TIERS.findIndex(t=>t.key===prevKey);
      if(rank.tierIndex > prevIdx){
        promotions.push({ muscle:m, label:MUSCLE_LABELS[m], rank });
      }
    }
    state.muscleRankState[m] = rank.key;
  });
  const totalXP = getTotalXP(stats);
  const level = getLevelForXP(totalXP);
  const hasPrevLevel = typeof state.globalLevelState === "number";
  const prevLevel = hasPrevLevel ? state.globalLevelState : level.level;
  const levelUp = hasPrevLevel && level.level > prevLevel;
  state.globalLevelState = level.level;
  saveState();
  if(promotions.length || levelUp){
    showRankUpCelebration(promotions, levelUp ? level : null);
  }
}

// ---------- Célébration animée (montée de rang / de niveau) ----------
function showRankUpCelebration(promotions, levelInfo){
  const overlay = document.createElement("div");
  overlay.className = "rankup-overlay";
  let inner = "";
  if(levelInfo){
    inner += `<div class="rankup-badge" style="background:var(--accent);">★</div>
      <div class="rankup-title">Niveau supérieur</div>
      <div class="rankup-name">Niveau ${levelInfo.level} — ${escapeHtml(levelInfo.title)}</div>`;
  } else {
    const first = promotions[0];
    inner += `<div class="rankup-badge" style="background:${first.rank.color};">▲</div>
      <div class="rankup-title">Rang supérieur</div>
      <div class="rankup-name">${escapeHtml(first.label)} — ${escapeHtml(first.rank.label)}</div>`;
  }
  if(promotions.length){
    inner += `<div class="rankup-list">${promotions.map(p=>`<span style="color:${p.rank.color}; font-weight:700;">${escapeHtml(p.label)}</span> → ${escapeHtml(p.rank.label)}`).join("<br>")}</div>`;
  }
  overlay.innerHTML = `<div class="rankup-card">${inner}<div class="rankup-hint">Tape pour continuer</div></div>`;
  document.body.appendChild(overlay);
  const card = overlay.querySelector(".rankup-card");
  spawnConfetti(card, 20);
  const dismiss = ()=>{
    overlay.classList.add("closing");
    setTimeout(()=> overlay.remove(), 250);
  };
  overlay.addEventListener("click", dismiss);
  setTimeout(dismiss, 4000);
}
function spawnConfetti(container, count){
  const colors = ["#2E5AAC","#C08B2C","#8891A0","#A9713F","#3E9C8F","#8B3EC7"];
  for(let i=0;i<count;i++){
    const p = document.createElement("div");
    p.className = "confetti-piece";
    const angle = Math.random()*Math.PI*2;
    const dist = 55 + Math.random()*95;
    p.style.setProperty("--dx", (Math.cos(angle)*dist).toFixed(1)+"px");
    p.style.setProperty("--dy", (Math.sin(angle)*dist).toFixed(1)+"px");
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random()*0.12).toFixed(2)+"s";
    container.appendChild(p);
  }
}

// ---------- Compléments alimentaires ----------
// Calcule la dose affichée : soit le texte fixe (par défaut), soit une dose
// calculée à partir du poids de corps (facteur x kg), avec un plafond de
// sécurité optionnel pour éviter qu'un calcul automatique dépasse une dose
// maximale raisonnable (ex : magnésium supplémentaire, seuil ~350 mg/j).
function computeSupplementDoseText(sup, weightKg){
  if(sup.doseMode === "perkg" && sup.doseFactor){
    let amount = parseFloat(sup.doseFactor) * weightKg;
    let capped = false;
    if(sup.doseMax && amount > parseFloat(sup.doseMax)){
      amount = parseFloat(sup.doseMax);
      capped = true;
    }
    const rounded = Math.round(amount*10)/10;
    const unit = sup.doseUnit || "g";
    return `${rounded} ${unit}/jour${capped?" (plafonné)":""} — calculé pour ${weightKg} kg`;
  }
  return sup.dose || "—";
}

  const total = sessionEx.length;

// Met à jour le texte "≈ X kcal" d'un exercice sans redessiner toute la page
function refreshExerciseKcalDisplay(dateISO, exId, rowEl){
  const log = getLog(dateISO);
  const found = getSessionExercises(log).find(item => item.ex.id === exId);
  if(!found) return;
  const { ex, met } = found;
  const exLog = getExLog(dateISO, exId);
  const kcalResult = estimateExerciseKcal(ex, met, getWeightKg(), exLog.reps);
  const restText = ex.rest && ex.rest!=="—" ? `Récup : ${ex.rest}` : "";
  const kcalText = `≈ ${Math.round(kcalResult.kcal)} kcal${kcalResult.reliability==="estimee"?" (estim.)":""}`;
  const restLine = [restText, kcalText].filter(Boolean).join(" · ");
  const exoContainer = rowEl.closest(".exo");
  if(exoContainer){
    const restEl = exoContainer.querySelector(".exo-rest");
    if(restEl) restEl.textContent = restLine;
  }
}

function bindExerciseLogInputs(dateISO){
  document.querySelectorAll(".exo-log[data-exid]").forEach(row=>{
    const exId = row.dataset.exid;
    const poidsInput = row.querySelector(".logPoids");
    const repsInput = row.querySelector(".logReps");
    const checkBtn = row.querySelector(".check-btn");
    if(!poidsInput || !repsInput || !checkBtn) return; // ligne incomplète, on ignore plutôt que de planter
    poidsInput.addEventListener("input", (e)=>{
      getExLog(dateISO, exId).poids = e.target.value; saveState();
    });
    repsInput.addEventListener("input", (e)=>{
      getExLog(dateISO, exId).reps = e.target.value; saveState();
      refreshExerciseKcalDisplay(dateISO, exId, row);
      updateProgressRing(dateISO);
    });
    checkBtn.addEventListener("click", (e)=>{
      const exLog = getExLog(dateISO, exId);
      exLog.done = !exLog.done;
      e.target.classList.toggle("on", exLog.done);
      if(exLog.done){
        e.target.classList.remove("pop");
        requestAnimationFrame(()=> e.target.classList.add("pop"));
      }
      saveState();
      updateProgressRing(dateISO);
      if(exLog.done) checkRankUps();
    });
  });
  document.querySelectorAll(".rpe-row").forEach(row=>{
    const exId = row.dataset.exid;
    row.querySelectorAll(".rpe-dot").forEach(dot=>{
      dot.addEventListener("click", ()=>{
        const val = Number(dot.dataset.rpe);
        const exLog = getExLog(dateISO, exId);
        exLog.rpe = (exLog.rpe===val) ? null : val;
        saveState();
        // mise à jour locale des points, sans redessiner toute la page
        row.querySelectorAll(".rpe-dot").forEach(d=>{
          const on = Number(d.dataset.rpe) === exLog.rpe;
          d.classList.toggle("on", on);
        });
        if(exLog.rpe === val){
          dot.classList.remove("pop");
          requestAnimationFrame(()=> dot.classList.add("pop"));
        }
      });
    });
  });
  document.querySelectorAll(".reorder-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const progKey = btn.dataset.progkey;
      const idx = Number(btn.dataset.idx);
      const dir = Number(btn.dataset.dir);
      moveProgramExercise(progKey, idx, dir);
      render();
    });
  });
}

// Déplace un exercice d'une position dans la liste d'un programme (persistant, comme une modification de programme)
function moveProgramExercise(progKey, index, dir){
  const prog = state.programs[progKey];
  if(!prog || !prog.exercises) return;
  const newIndex = index + dir;
  if(newIndex < 0 || newIndex >= prog.exercises.length) return;
  const tmp = prog.exercises[index];
  prog.exercises[index] = prog.exercises[newIndex];
  prog.exercises[newIndex] = tmp;
  saveState();
}

// Confirmation en deux temps intégrée à l'appli (remplace window.confirm, peu fiable
// dans les PWA installées sur l'écran d'accueil sur iOS). Premier tap = armement,
// second tap dans les 3s = confirmation réelle.
function armDangerButton(btn, confirmLabel, onConfirm){
  let armed = false;
  let timer = null;
  const originalText = btn.textContent;
  btn.addEventListener("click", ()=>{
    if(!armed){
      armed = true;
      btn.textContent = confirmLabel;
      btn.classList.add("armed");
      timer = setTimeout(()=>{
        armed = false;
        btn.textContent = originalText;
        btn.classList.remove("armed");
      }, 3000);
    } else {
      clearTimeout(timer);
      armed = false;
      onConfirm();
    }
  });
}

function bindProgramEditForm(prog){
  document.getElementById("addExoBtn").addEventListener("click", ()=>{
    prog.exercises.push({ id: "custom_"+Date.now(), name:"Nouvel exercice", desc:"", sets:"", rest:"" });

  document.querySelectorAll("[data-remove]").forEach(btn=>{

      const idx = Number(btn.dataset.remove);
      prog.exercises.splice(idx,1);
      saveState();
      render();

  document.getElementById("saveProgBtn").addEventListener("click", ()=>{

function guessMealType(){
  const h = new Date().getHours();
  if(h < 11) return "petit_dej";
  if(h < 15) return "dejeuner";
  if(h < 19) return "collation";
  return "diner";
}

// ---------- Scan code-barres (BarcodeDetector natif + Open Food Facts, gratuit) ----------
let zxingControlsRef = null;
let barcodeScanHandled = false; // verrou anti-collision : une seule détection traitée par scan

function stopBarcodeScan(){
  if(barcodeStreamRef){
    barcodeStreamRef.getTracks().forEach(t=>t.stop());
    barcodeStreamRef = null;
  }
  if(zxingControlsRef){
    try{ zxingControlsRef.stop(); }catch(e){ /* déjà arrêté */ }
    zxingControlsRef = null;
  }
}

async function startBarcodeScan(dateISO){
  const video = document.getElementById("barcodeVideo");
  const resultEl = document.getElementById("barcodeResult");
  video.style.display = "block";
  barcodeScanHandled = false;

  if("BarcodeDetector" in window){
    // Chemin natif, rapide (Chrome/Edge/Android) — Safari/iOS n'implémente pas cette API
    try{
      barcodeStreamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = barcodeStreamRef;
      await video.play();
      const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e"] });
      resultEl.innerHTML = `<div class="section-meta">Vise le code-barres...</div>`;
      const scanLoop = async ()=>{
        if(!barcodeStreamRef || barcodeScanHandled) return; // scan arrêté ou déjà traité entre-temps
        try{
          const codes = await detector.detect(video);
          if(codes.length && !barcodeScanHandled){
            barcodeScanHandled = true; // verrouille avant tout traitement asynchrone
            stopBarcodeScan();
            video.style.display = "none";
            await lookupBarcode(codes[0].rawValue, dateISO);
            return;
          }
        }catch(e){ /* frame invalide, on continue */ }
        requestAnimationFrame(scanLoop);
      };
      scanLoop();
    }catch(err){
      console.error(err);
      resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Impossible d'accéder à la caméra : ${escapeHtml(err.message||"permission refusée")}.</div>`;
    }
    return;
  }

  // Repli universel (Safari/iOS notamment) : décodage pur JS via ZXing, aucune dépendance à une API navigateur native.
  // Chargé depuis un CDN au premier usage (nécessite internet une fois), aucune clé requise.
  resultEl.innerHTML = `<div class="section-meta">Chargement du lecteur de code-barres...</div>`;
  try{
    const { BrowserMultiFormatReader } = await import("https://esm.run/@zxing/browser");
    const codeReader = new BrowserMultiFormatReader();
    resultEl.innerHTML = `<div class="section-meta">Vise le code-barres...</div>`;
    await codeReader.decodeFromVideoDevice(undefined, video, (result, err, controls)=>{
      zxingControlsRef = controls;
      if(result && !barcodeScanHandled){
        barcodeScanHandled = true; // verrouille avant tout traitement asynchrone (ZXing peut rappeler plusieurs fois de suite)
        const value = result.getText();
        stopBarcodeScan();
        video.style.display = "none";
        lookupBarcode(value, dateISO);
      }
    });
  }catch(err){
    console.error(err);
    resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Impossible de démarrer le scan : ${escapeHtml(err.message||"erreur inconnue")}. Vérifie ta connexion internet (nécessaire une fois) et l'autorisation caméra.</div>`;
  }
}

async function lookupBarcode(code, dateISO){
  const resultEl = document.getElementById("barcodeResult");
  resultEl.innerHTML = `<div class="section-meta">Recherche du produit (${escapeHtml(code)})...</div>`;
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
    const data = await res.json();
    if(data.status !== 1 || !data.product){
      resultEl.innerHTML = `<div class="divider-note">Produit introuvable dans Open Food Facts. Ajoute-le manuellement.</div>`;
      return;
    }
    const p = data.product;
    const n = p.nutriments || {};
    let defaultGrams = 100;
    if(p.serving_size){
      const gm = String(p.serving_size).match(/(\d+(\.\d+)?)/);
      if(gm) defaultGrams = parseFloat(gm[1]);
    }
    const prefill = {
      name: p.product_name || "Produit scanné",
      grams: defaultGrams,
      kcal: n["energy-kcal_100g"] || 0,
      protein: n["proteins_100g"] || 0,
      carbs: n["carbohydrates_100g"] || 0,
      fat: n["fat_100g"] || 0
    };
    resultEl.innerHTML = `<div class="section-meta" style="margin-bottom:8px;">Trouvé : ${escapeHtml(prefill.name)} — ajuste la quantité réellement consommée si besoin.</div>` + renderFoodConfirmForm(prefill, false);
    bindConfirmFormWithCorrection(dateISO, resultEl, "barcode");
  }catch(err){
    console.error(err);
    resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Erreur réseau lors de la recherche du produit.</div>`;
  }
}

// ---------- Analyse photo par IA (Gemini, gratuit avec clé perso) ----------
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let lastPhotoBase64 = null;
let lastPhotoMimeType = null;
let lastPhotoGuess = null;

async function callGeminiVision(promptText){
  const apiKey = getStoredGeminiKey();
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [
        { inline_data: { mime_type: lastPhotoMimeType||"image/jpeg", data: lastPhotoBase64 } },
        { text: promptText }
      ]}]
    })
  });
  const data = await res.json();
  if(!res.ok){
    const msg = (data && data.error && data.error.message) || `Erreur HTTP ${res.status}`;
    throw new Error(msg);
  }
  let text = (((data.candidates||[])[0]||{}).content||{}).parts?.[0]?.text || "";
  text = text.replace(/```json|```/g, "").trim();
  return JSON.parse(text);
}

    carbs: Number(document.getElementById("confirmCarbs").value||0) * ratio,
    fat: Number(document.getElementById("confirmFat").value||0) * ratio,
    grams

}

async function correctPhotoAnalysis(dateISO, resultEl){
  const correction = document.getElementById("photoCorrectionInput").value.trim();
  if(!correction){ showToast("Précise ce que c'est avant de renvoyer.", true); return; }
  resultEl.innerHTML = `<div class="section-meta">Nouvelle analyse en cours avec ta précision...</div>`;
  try{
    const prompt = `Ta précédente estimation pour cette photo était : ${JSON.stringify(lastPhotoGuess)}. La personne précise ceci sur le contenu réel de son repas : "${correction}". Corrige ton estimation en tenant compte de cette précision. Estime le poids total de la portion visible en grammes, et les valeurs nutritionnelles POUR 100 G de cet aliment/repas (pas pour la portion totale). Réponds UNIQUEMENT avec un objet JSON strict, sans texte autour, sans balises markdown, au format exact : {"name":"...","grams":0,"kcal":0,"protein":0,"carbs":0,"fat":0} (nom en français, kcal/protein/carbs/fat = valeurs pour 100 g, grams = poids total estimé de la portion, tout en nombres).`;
    const parsed = await callGeminiVision(prompt);
    lastPhotoGuess = parsed;
    resultEl.innerHTML = `<div class="section-meta" style="margin-bottom:8px;">Estimation corrigée — vérifie avant d'ajouter :</div>` + renderFoodConfirmForm(parsed, true);
    bindConfirmFormWithCorrection(dateISO, resultEl, "photo");

    console.error(err);
    resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Échec de la correction : ${escapeHtml(err.message||"erreur inconnue")}</div>`;
  }

    bindConfirmFormWithCorrection(dateISO, resultEl, "photo");

    resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Échec de l'analyse : ${escapeHtml(err.message||"erreur inconnue")}</div>`;

      el.setAttribute("fill", rank.color);
      el.classList.toggle("zone-neglected", st.neglected);
    });
  });
}

// VUE : ANALYSE (poids, courbe, résumé d'activité, notes)
// ============================================================
let weightChartRangeDays = 90; // 30 / 90 / Infinity

function getWeightEntriesSorted(){
  return Object.keys(state.weightLog||{}).sort().map(d=>({ dateISO:d, weight:state.weightLog[d] }));
}
function filterEntriesByRange(entries, days){
  if(days === Infinity) return entries;
  const today = new Date();
  return entries.filter(e => daysBetweenISO(e.dateISO, today) <= days);
}
function buildWeightChartSVG(entries){
  const width = 320, height = 130, pad = 20;
  if(entries.length < 2){
    return `<div class="empty" style="padding:30px 10px;">Ajoute au moins 2 pesées pour voir la courbe.</div>`;
  }
  const weights = entries.map(e=>e.weight);
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const rangeW = Math.max(0.5, maxW - minW);
  const stepX = (width - pad*2) / (entries.length - 1);
  const points = entries.map((e,i)=>{
    const x = pad + i*stepX;
    const y = pad + (height - pad*2) * (1 - (e.weight - minW) / rangeW);
    return { x, y, ...e };
  });
  const pathD = points.map((p,i)=> (i===0?"M":"L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${height-pad} L${points[0].x.toFixed(1)},${height-pad} Z`;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">
    <path d="${areaD}" fill="#EAF0FA" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="#2E5AAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  points.forEach((p,i)=>{
    const isLast = i===points.length-1;
    svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?4:2.2}" fill="${isLast?'#2E5AAC':'#fff'}" stroke="#2E5AAC" stroke-width="1.4"/>`;
  });
  svg += `<text x="${pad}" y="12" font-size="9" fill="#8B93A0" font-family="ui-monospace,monospace">${maxW.toFixed(1)} kg</text>
    <text x="${pad}" y="${height-6}" font-size="9" fill="#8B93A0" font-family="ui-monospace,monospace">${minW.toFixed(1)} kg</text></svg>`;
  return svg;
}
function computeActivitySummary(){
  const today = new Date();
  function sessionsInRange(minAgo, maxAgo){
    let count = 0;
    Object.keys(state.logs).forEach(dateISO=>{
      const daysAgo = daysBetweenISO(dateISO, today);
      if(daysAgo>=minAgo && daysAgo<=maxAgo){
        if(Object.values(state.logs[dateISO].exercises||{}).some(e=>e.done)) count++;
      }
    });
    return count;
  }
  function avgRPE(minAgo, maxAgo){
    let sum=0, n=0;
    Object.keys(state.logs).forEach(dateISO=>{
      const daysAgo = daysBetweenISO(dateISO, today);
      if(daysAgo>=minAgo && daysAgo<=maxAgo){
        Object.values(state.logs[dateISO].exercises||{}).forEach(e=>{ if(e.done && e.rpe){ sum+=e.rpe; n++; } });
      }
    });
    return n ? sum/n : null;
  }
  let kcal7 = 0;
  Object.keys(state.logs).forEach(dateISO=>{
    if(daysBetweenISO(dateISO, today) <= 6){
      kcal7 += estimateSessionKcalDone(state.logs[dateISO], getWeightKg()).kcal;
    }
  });
  return {
    thisWeek: sessionsInRange(0,6),
    lastWeek: sessionsInRange(7,13),
    rpeRecent: avgRPE(0,13),
    rpePrior: avgRPE(14,27),
    kcal7
  };
}

// Régression linéaire simple (méthode des moindres carrés) sur les pesées -> tendance en kg/semaine
function computeWeightTrend(entries){
  if(entries.length < 3) return null;
  const today = new Date();
  const xs = entries.map(e => -daysBetweenISO(e.dateISO, today)); // jours écoulés (négatif = passé)
  const ys = entries.map(e => e.weight);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((a,x,i)=>a+x*ys[i],0);
  const sumXX = xs.reduce((a,x)=>a+x*x,0);
  const denom = (n*sumXX - sumX*sumX);
  if(denom === 0) return null;
  const slopePerDay = (n*sumXY - sumX*sumY) / denom; // kg/jour
  return slopePerDay * 7; // kg/semaine
}

// Compare le rythme de variation de poids attendu (déduit de l'objectif/déficit choisi) au rythme réellement mesuré
// (règle empirique : ~7700 kcal ≈ 1 kg de masse grasse). Ne s'applique qu'en mode objectifs automatiques,
// puisque c'est le seul cas où un "objectif de rythme" précis est déduit d'un calcul.
const KCAL_PER_KG = 7700;
function computeGoalVsReality(){
  if(!state.nutritionGoals || !state.nutritionGoals.auto) return null;
  const goal = GOAL_TYPES.find(g=>g.key===state.profile.goal) || GOAL_TYPES[2];
  const predictedKgPerWeek = (goal.kcalAdjust * 7) / KCAL_PER_KG;

  const entries = getWeightEntriesSorted();
  if(entries.length < 3) return { insufficientData:true, goal, predictedKgPerWeek };
  const spanDays = daysBetweenISO(entries[0].dateISO, new Date());
  if(spanDays < 10) return { insufficientData:true, goal, predictedKgPerWeek };

  const actualKgPerWeek = computeWeightTrend(entries);
  if(actualKgPerWeek === null) return { insufficientData:true, goal, predictedKgPerWeek };

  let verdict, message;
  const tolerance = 0.1;
  if(goal.key === "maintain"){
    if(Math.abs(actualKgPerWeek) <= tolerance){ verdict="ontrack"; message="Ton poids est stable — conforme à l'objectif de maintien."; }
    else { verdict="off"; message=`Ton poids ${actualKgPerWeek>0?"augmente":"diminue"} de ${Math.abs(actualKgPerWeek).toFixed(2)} kg/semaine alors que l'objectif est la stabilité — ${actualKgPerWeek>0?"réduis légèrement les calories":"augmente légèrement les calories"}.`; }
  } else if(goal.key === "gain"){
    if(actualKgPerWeek >= predictedKgPerWeek*0.5){ verdict="ontrack"; message=`Prise de poids cohérente (${actualKgPerWeek.toFixed(2)} kg/semaine) — conforme à l'objectif.`; }
    else { verdict="off"; message=`Tu ne prends que ${actualKgPerWeek.toFixed(2)} kg/semaine (attendu ≈ ${predictedKgPerWeek.toFixed(2)}) — envisage d'augmenter légèrement les calories.`; }
  } else { // lose ou recomp : rythme attendu négatif
    if(actualKgPerWeek <= predictedKgPerWeek*0.5){ verdict="ontrack"; message=`Perte de poids cohérente (${actualKgPerWeek.toFixed(2)} kg/semaine) — conforme à l'objectif.`; }
    else if(actualKgPerWeek > 0.05){ verdict="off"; message=`Ton poids ne baisse pas (${actualKgPerWeek>=0?"+":""}${actualKgPerWeek.toFixed(2)} kg/semaine) malgré l'objectif de ${goal.label.toLowerCase()} — envisage d'augmenter le déficit calorique.`; }
    else { verdict="slow"; message=`Perte plus lente que prévu (${actualKgPerWeek.toFixed(2)} kg/semaine, attendu ≈ ${predictedKgPerWeek.toFixed(2)}) — encore acceptable, mais surveille les prochaines semaines.`; }
  }
  return { insufficientData:false, goal, predictedKgPerWeek, actualKgPerWeek, verdict, message };
}

// Records personnels + régularité hebdomadaire (8 dernières semaines) — 100% calculé, pas d'IA
function computePersonalRecords(){
  const weightKg = getWeightKg();
  let bestKcal = 0, bestKcalDate = null, totalKcalAllTime = 0, totalSessions = 0;
  Object.keys(state.logs).forEach(dateISO=>{
    const log = state.logs[dateISO];
    if(!Object.values(log.exercises||{}).some(e=>e.done)) return;
    totalSessions++;
    const kcal = estimateSessionKcalDone(log, weightKg).kcal;
    totalKcalAllTime += kcal;
    if(kcal > bestKcal){ bestKcal = kcal; bestKcalDate = dateISO; }
  });

  const today = new Date();
  let weeksWithConsistency = 0;
  for(let w=0; w<8; w++){
    const minAgo = w*7, maxAgo = w*7+6;
    let count = 0;
    Object.keys(state.logs).forEach(dateISO=>{
      const daysAgo = daysBetweenISO(dateISO, today);
      if(daysAgo>=minAgo && daysAgo<=maxAgo && Object.values(state.logs[dateISO].exercises||{}).some(e=>e.done)) count++;
    });
    if(count >= 2) weeksWithConsistency++;
  }

  return { bestKcal, bestKcalDate, totalKcalAllTime: Math.round(totalKcalAllTime), totalSessions, weeksWithConsistency };
}
const NOTE_KEYWORDS = ["douleur","blessure","fatigue","épuisé","epuise","crampe","mal au","mal aux","mal a","mal à"];
function scanRecentNotes(limit){
  const dates = Object.keys(state.logs).filter(d=>state.logs[d].note && state.logs[d].note.trim()).sort((a,b)=>b.localeCompare(a));
  const recent = dates.slice(0, limit).map(d=>({ dateISO:d, note:state.logs[d].note }));
  const flagged = [];
  dates.slice(0,30).forEach(d=>{
    const low = state.logs[d].note.toLowerCase();
    NOTE_KEYWORDS.forEach(k=>{ if(low.includes(k)) flagged.push({ dateISO:d, keyword:k }); });
  });
  return { recent, flagged };
}

    <div style="border-top:1px solid var(--line-soft); margin:14px 0;"></div>

  // ---- Notes récentes / alertes ----

    <div class="section-title" style="margin-bottom:8px;">Notes de séance récentes</div>`;
  if(notesInfo.flagged.length){

    html += `<div class="divider-note" style="border-left-color:var(--danger);">⚠ Mots-clés à surveiller (douleur/fatigue/blessure) repérés dans ${uniqueDates.length} note(s) récente(s) — relis-les si besoin.</div>`;

  if(notesInfo.recent.length){

async function ensureLocalAiEngine(){
  if(localAiEngine) return localAiEngine;
  setLocalAiStatus(`<div class="section-meta">Chargement de la bibliothèque IA locale...</div>`);
  // Chargée depuis un CDN au premier lancement (nécessite internet une fois), puis mise en cache par le navigateur.
  const webllm = await import("https://esm.run/@mlc-ai/web-llm");

  // Sélection dynamique d'un petit modèle disponible plutôt qu'un identifiant figé
  // (évite un échec si la liste de modèles de la bibliothèque a changé entre-temps).
  const allIds = webllm.prebuiltAppConfig.model_list.map(m => m.model_id);
  const small = allIds.filter(id => /Instruct/i.test(id) && /(0\.5B|1B|1\.5B|2B)\b/i.test(id));
  const modelId =
    small.find(id => /Qwen2\.5-1\.5B/i.test(id)) ||
    small.find(id => /Llama-3\.2-1B/i.test(id)) ||
    small.find(id => /Qwen2\.5-0\.5B/i.test(id)) ||
    small[0];
  if(!modelId) throw new Error("Aucun petit modèle disponible dans la bibliothèque.");

  setLocalAiStatus(`<div class="section-meta">Téléchargement du modèle « ${escapeHtml(modelId)} »... (une seule fois)</div>
    <div class="level-bar" style="margin-top:6px;"><div class="level-bar-fill" id="localAiProgressBar" style="width:0%"></div></div>`);

  localAiEngine = await webllm.CreateMLCEngine(modelId, {
    initProgressCallback: (progress)=>{
      const pct = Math.round((progress.progress||0) * 100);
      const bar = document.getElementById("localAiProgressBar");
      if(bar) bar.style.width = pct + "%";
      setLocalAiStatus(`<div class="section-meta">${escapeHtml(progress.text || "Chargement...")} (${pct}%)</div>
        <div class="level-bar" style="margin-top:6px;"><div class="level-bar-fill" id="localAiProgressBar" style="width:${pct}%"></div></div>`);
    }
  });
  return localAiEngine;
}

function buildLocalAiSystemPrompt(){
  return `Tu es un coach personnel expert, avec une double spécialité :

1) NUTRITION SPORTIVE : tu maîtrises le calcul des besoins caloriques (métabolisme de base, dépense selon l'activité), la répartition des macronutriments (protéines/glucides/lipides) selon l'objectif (perte de poids, prise de masse, recomposition corporelle), le timing des repas autour de l'entraînement, l'hydratation, et les compléments alimentaires de base (créatine, oméga-3, vitamine D, électrolytes, magnésium) — leurs usages, dosages typiques et limites de sécurité.

2) PRÉPARATION PHYSIQUE COMBAT : sports de combat (MMA, Muay Thaï, grappling/lutte), périodisation de l'entraînement, gestion de la fatigue/RPE, prévention des blessures, renforcement ciblé (cou, grip, gainage).

async function sendLocalAiMessage(){
  const input = document.getElementById("localAiChatInput");
  const sendBtn = document.getElementById("localAiSendBtn");
  const text = input.value.trim();
  if(!text) return;
  if(!navigator.gpu){
    setLocalAiStatus(`<div class="divider-note" style="border-left-color:var(--danger);">WebGPU indisponible sur ce navigateur/appareil — utilise plutôt le copier-coller vers Claude.ai.</div>`);
    return;
  }
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;
  localAiChatHistory.push({ role:"user", content:text });
  refreshLocalAiChatBox();

  try{
    const engine = await ensureLocalAiEngine();
    setLocalAiStatus(`<div class="section-meta">Le modèle réfléchit... (peut prendre 10s à 1 min sur téléphone)</div>`);
    const messages = [
      { role:"system", content: buildLocalAiSystemPrompt() },
      ...localAiChatHistory
    ];
    const reply = await engine.chat.completions.create({ messages, temperature:0.7, max_tokens:400 });
    const replyText = reply.choices[0].message.content.trim();
    localAiChatHistory.push({ role:"assistant", content:replyText });
    setLocalAiStatus("");
  }catch(err){
    console.error(err);
    localAiChatHistory.push({ role:"assistant", content:"⚠ Erreur : "+(err.message||"impossible de répondre. Ton appareil n'a peut-être pas assez de mémoire, ou la connexion a été interrompue pendant le téléchargement du modèle.") });
  }finally{
    refreshLocalAiChatBox();
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// Construit un résumé compact des données récentes à envoyer à l'API (contrôle du volume/coût)
function buildAnalysisPayload(){
  const weightKg = getWeightKg();
  const entries = getWeightEntriesSorted().slice(-20);
  const weightLines = entries.map(e=>`${e.dateISO}: ${e.weight} kg`).join("\n") || "aucune pesée enregistrée";

  const dates = Object.keys(state.logs).sort((a,b)=>b.localeCompare(a)).slice(0, 25);
  const sessionLines = dates.map(d=>{
    const log = state.logs[d];
    const prog = state.programs[log.programKey];
    const done = Object.values(log.exercises||{}).filter(e=>e.done).length;
    const rpes = Object.values(log.exercises||{}).filter(e=>e.done && e.rpe).map(e=>e.rpe);
    const avgRpe = rpes.length ? (rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1) : "—";
    const note = log.note ? ` | note: "${log.note}"` : "";
    return `${d} — ${prog?prog.name:"?"} — ${done} exos faits, RPE moyen ${avgRpe}${note}`;
  }).join("\n");

  const stats = computeMuscleStats();
  const muscleLines = MUSCLE_GROUPS.map(m=>{
    const st = stats[m];
    const rank = getRankForXP(st.totalXP);
    return `${MUSCLE_LABELS[m]}: rang ${rank.label}${st.neglected?" (délaissé)":""}, dernière fois ${st.lastDaysAgo===null?"jamais":st.lastDaysAgo+"j"}`;
  }).join("\n");

  // ---- Nutrition : objectifs + repas des 7 derniers jours + hydratation ----
  const goals = getEffectiveNutritionGoals();
  const goalLine = `Calories ${goals.kcal} kcal/j, protéines ${goals.protein} g, glucides ${goals.carbs} g, lipides ${goals.fat} g, eau ${goals.water_ml} ml${goals.auto?" (calculé automatiquement selon profil/objectif)":""}.`;

  const nutritionDates = Object.keys(state.nutritionLog).sort((a,b)=>b.localeCompare(a)).slice(0,7);
  const nutritionLines = nutritionDates.map(d=>{
    const day = state.nutritionLog[d];
    const totals = sumMacros(day.meals||[]);
    const mealsSummary = (day.meals||[]).map(m=>`${m.name} (${Math.round(m.kcal)} kcal, ${m.mealType||"?"})`).join(", ") || "aucun repas noté";
    return `${d} — ${Math.round(totals.kcal)} kcal (P${Math.round(totals.protein)}/G${Math.round(totals.carbs)}/L${Math.round(totals.fat)}), eau ${day.water_ml||0} ml — ${mealsSummary}`;
  }).join("\n");

  const supplementLines = (state.supplements||[]).map(s=>`${s.name} (${computeSupplementDoseText(s, weightKg)}, ${s.timing})`).join("\n");

  return `Profil : ${state.profile.age||""}, ${weightKg} kg.

Pesées récentes :
${weightLines}

Séances récentes (les plus récentes en premier) :
${sessionLines || "aucune séance enregistrée"}

État des groupes musculaires :
${muscleLines}

Objectifs nutritionnels quotidiens :
${goalLine}

Alimentation des 7 derniers jours :
${nutritionLines || "aucun repas enregistré récemment"}

Compléments alimentaires suivis :
${supplementLines || "aucun"}`;
}

async function runAiAnalysis(){
  const resultEl = document.getElementById("aiAnalysisResult");
  const btn = document.getElementById("aiAnalyzeBtn");
  const apiKey = getStoredApiKey();
  if(!apiKey){
    resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Aucune clé API configurée. Va dans Réglages → "Analyse IA" pour en ajouter une.</div>`;
    return;
  }
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Analyse en cours...";
  resultEl.innerHTML = `<div class="section-meta">Claude lit tes séances et tes notes...</div>`;

  const payload = buildAnalysisPayload();
  const prompt = `Tu es un préparateur physique spécialisé en sports de combat (MMA/Muay Thaï/grappling). Voici les données d'entraînement d'un pratiquant. Rédige une analyse en français, concrète et bienveillante (pas de jargon médical, pas de diagnostic) :
1) Ce qui va bien dans sa régularité et sa progression
2) Les points de vigilance (surcharge, groupe délaissé, note inquiétante, plateau de poids...)
3) 2-3 conseils concrets pour la suite
Reste sous 200 mots, ton direct et personnel (tutoiement).

Données :
${payload}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 700,
        messages: [{ role:"user", content: prompt }]
      })
    });
    const data = await response.json();
    if(!response.ok){
      const msg = (data && data.error && data.error.message) || `Erreur HTTP ${response.status}`;
      resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Échec de l'analyse : ${escapeHtml(msg)}</div>`;
    } else {
      const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      resultEl.innerHTML = `<div class="exo-desc" style="white-space:pre-wrap;">${escapeHtml(text)}</div>`;
    }
  }catch(err){
    console.error(err);
    resultEl.innerHTML = `<div class="divider-note" style="border-left-color:var(--danger);">Erreur réseau — vérifie ta connexion et ta clé API.</div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function renderJournal(app){
  const dates = Object.keys(state.logs).sort((a,b)=> b.localeCompare(a));
  const weightKg = getWeightKg();
  let html = renderMuscleSection();

  html += `<div class="eyebrow">Historique des séances</div>`;

  if(dates.length===0){
    html += `<div class="empty"><div class="empty-ic">${FIST_SVG}</div>Aucune séance enregistrée pour l'instant.<br>Va dans « Aujourd'hui » pour commencer ton carnet.</div>`;
    app.innerHTML = html;
    bindMuscleSection();
    return;
  }

  // streak simple : nb de jours avec au moins un exercice fait
  const activeDays = dates.filter(d => Object.values(state.logs[d].exercises||{}).some(e=>e.done));
  let totalKcal = 0, anyEstimatedGlobal = false;
  dates.forEach(d=>{
    const log = state.logs[d];
    if(log.programKey || (log.extraPrograms||[]).length){
      const r = estimateSessionKcalDone(log, weightKg);
      totalKcal += r.kcal;
      if(r.reliability === "estimee") anyEstimatedGlobal = true;
    }
  });
  html += `<div class="card"><div class="section-title">Séances enregistrées</div>
    <div class="streak-row"><span class="streak-chip">${activeDays.length} séance(s) validée(s)</span><span class="streak-chip">${dates.length} jour(s) noté(s)</span><span class="streak-chip">≈ ${totalKcal} kcal cumulées${anyEstimatedGlobal?" *":""}</span></div>
    ${anyEstimatedGlobal?'<div class="section-meta" style="margin-top:8px;">* certaines séances sans répétitions notées — calories estimées sur une moyenne du programme.</div>':""}
  </div>`;

  dates.forEach(dateISO=>{
    const log = state.logs[dateISO];
    const prog = state.programs[log.programKey];
    const sessionEx = getSessionExercises(log);
    const doneCount = Object.values(log.exercises||{}).filter(e=>e.done).length;
    const totalCount = sessionEx.length;
    const kcalResult = (prog || (log.extraPrograms||[]).length) ? estimateSessionKcalDone(log, weightKg) : { kcal:0, reliability:"bonne" };
    const supTaken = Object.values(log.supplements||{}).filter(isSupTaken).length;
    const supLine = state.supplements.length ? `<span class="streak-chip" style="margin-top:6px;">💊 ${supTaken}/${state.supplements.length} compléments</span>` : "";
    const progLabel = prog ? escapeHtml(prog.name) : (totalCount>0 ? "Programme non défini" : "Jour de repos");
    html += `<div class="card ${doneCount>0?'done':''}">
      <div class="section-title">${fmtDateHuman(dateISO)}</div>
      <div class="section-meta">${progLabel}${totalCount>0?` — ${doneCount}/${totalCount} exercices validés${kcalResult.kcal?` · ≈ ${kcalResult.kcal} kcal${kcalResult.reliability==="estimee"?" (estim.)":""}`:""}`:""}</div>
      ${supLine}
      ${log.note?`<div class="exo-desc" style="margin-top:8px;">${escapeHtml(log.note)}</div>`:""}
      <button class="btn ghost small" style="margin-top:10px;" data-open="${dateISO}">Voir le détail</button>
    </div>`;
  });

  app.innerHTML = html;
  bindMuscleSection();

  document.querySelectorAll("[data-open]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      openJournalDetail(btn.dataset.open);
    });
  });
}

function openJournalDetail(dateISO){
  const app = document.getElementById("app");
  const log = state.logs[dateISO];
  const mainProg = state.programs[log.programKey];
  const weightKg = getWeightKg();
  let html = `<button class="btn ghost on-dark small" id="backBtn">← Retour au carnet</button>
  <div class="eyebrow" style="margin-top:14px;">${fmtDateHuman(dateISO)}</div>`;

  if(mainProg || (log.extraPrograms||[]).length){
    const kcalTotal = estimateSessionKcalDone(log, weightKg);
    html += `<div class="card"><div class="section-meta">${formatKcalText(kcalTotal)} sur cette séance</div></div>`;
  }
  if(mainProg) html += renderReadOnlyMainProgram(mainProg, log, weightKg);
  (log.extraPrograms||[]).forEach(key=>{
    const p = state.programs[key];
    if(p) html += renderReadOnlyProgram(p.name, p.exercises, log, weightKg, p.met||5);
  });

  if(log.note){
    html += `<div class="card"><div class="section-title">Note</div><div class="exo-desc" style="margin-top:6px;">${escapeHtml(log.note)}</div></div>`;
  }
  if(state.supplements && state.supplements.length){
    html += `<div class="card"><div class="section-title" style="margin-bottom:6px;">Compléments</div>`;
    state.supplements.forEach(sup=>{
      const supVal = (log.supplements||{})[sup.id];
      const taken = isSupTaken(supVal);
      const time = (typeof supVal === "object" && supVal && supVal.time) ? ` à ${escapeHtml(supVal.time)}` : "";
      html += `<div class="exo"><div class="exo-desc">${taken?"✅":"⬜"} ${escapeHtml(sup.name)} — ${escapeHtml(computeSupplementDoseText(sup, getWeightKg()))}${taken?time:""}</div></div>`;
    });
    html += `</div>`;
  }
  html += `<button class="btn danger on-dark block" id="deleteDayBtn" style="margin-top:6px;">Supprimer cette séance du carnet</button>`;
  app.innerHTML = html;
  document.getElementById("backBtn").addEventListener("click", ()=>render());
  armDangerButton(document.getElementById("deleteDayBtn"), "Confirmer la suppression ?", ()=>{
    delete state.logs[dateISO];
    saveState();
    render();
  });
}
